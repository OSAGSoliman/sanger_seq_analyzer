{% extends "base.html" %}
{% block title %}Change password · Sanger Seq Analyzer{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  {% if user and user.must_change %}<div class="notice info">Choose your own password before you start.</div>{% endif %}
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="new" autocomplete="new-password" minlength="12" required>
      <span class="hint">At least 12 characters. A short sentence is easy to remember.</span></label>
    <label>New password again <input type="password" name="again" autocomplete="new-password" minlength="12" required></label>
    <button class="primary">Change password</button>
  </form>
</section>
{% endblock %}
