# Sanger Seq Analyzer lab server with Docker Compose (see DEPLOY.md).
#
#   mkdir -p data && sudo chown 10001:10001 data      # the container runs as user 10001
#   docker compose up -d
#   docker compose exec sanger-seq sanger-seq server create-admin
#
# HTTPS: put the hospital certificate and key in data/certs/ and set in data/config.toml
#   tls_cert = "certs/server.crt"
#   tls_key  = "certs/server.key"

services:
  sanger-seq:
    image: sanger-seq-server:${SANGER_SEQ_VERSION:-latest}
    build:
      context: ../..
      dockerfile: packaging/server/Dockerfile
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      TZ: Asia/Dubai
    volumes:
      - ./data:/data
      # The lab's shared folders, mounted on this Linux host first (CIFS, see DEPLOY.md).
      # Add them on the Admin › Folders page as /shares/... paths.
      # - /mnt/virology:/shares/virology
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
