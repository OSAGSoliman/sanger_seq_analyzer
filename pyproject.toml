[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanger_seq_analyzer"
version = "0.4.1"
description = "Sanger sequencing analysis: .ab1 QC, trimming, mixture calling and forward/reverse consensus FASTA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["biopython>=1.80", "numpy>=1.22", "PySide6-Essentials>=6.6", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.10"]

[project.scripts]
sanger-seq = "sanger_seq_analyzer.cli:main"

[project.gui-scripts]
sanger-seq-gui = "sanger_seq_analyzer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Print every thread's stack if a test runs this long (finds hangs on CI machines).
faulthandler_timeout = 300
testpaths = ["tests"]
