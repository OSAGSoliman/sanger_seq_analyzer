[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanger_seq_analyzer"
version = "0.5.0"
description = "Sanger sequencing analysis: .ab1 QC, trimming, mixture calling and forward/reverse consensus FASTA"
readme = "README.md"
requires-python = ">=3.12"
# The analysis core (command line, Fetch data logic). The window and the server are extras:
#   pip install ".[gui]"     desktop app          pip install ".[server]"   web server for the lab
dependencies = ["biopython>=1.80", "numpy>=1.22", "openpyxl>=3.1", "python-calamine>=0.4"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "tzdata>=2024.1"]
dev = ["pytest>=7", "httpx>=0.27"]
build = ["pyinstaller>=6.10"]

[project.scripts]
sanger-seq = "sanger_seq_analyzer.cli:main"

[project.gui-scripts]
sanger-seq-gui = "sanger_seq_analyzer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the server's pages, styles and scripts (not Python files, so listed here)
sanger_seq_analyzer = ["server/templates/*.html", "server/static/*"]

[tool.pytest.ini_options]
# Print every thread's stack if a test runs this long (finds hangs on CI machines).
faulthandler_timeout = 300
testpaths = ["tests"]
