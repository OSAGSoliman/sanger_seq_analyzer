name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v --durations=15
      - run: sanger-seq qc examples --reference measles-n450 -o sanger_results

  cli-no-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install without PySide6
        run: |
          python -m pip install --no-deps -e .
          python -m pip install biopython numpy pytest
      - run: python -c "import sanger_seq_analyzer.cli, sys; assert 'PySide6' not in sys.modules"
      - run: python -m pytest -q --ignore=tests/gui
      - run: sanger-seq qc examples --reference measles-n450 -o sanger_results

  build:
    needs: [test, cli-no-qt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            size_limit_mb: 150
          - os: macos-latest
            name: macos
            size_limit_mb: 250
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c packaging/constraints.txt ".[build]"
      - name: Build desktop app and command-line tool
        run: python packaging/build.py
      - name: Smoke test the command-line build
        shell: bash
        run: |
          ./dist/sanger-seq qc examples -r measles-n450 -o smoke
          test "$(grep -c '^>' smoke/consensus.fasta)" = "3"
      - name: Self-test the desktop app (macOS)
        if: runner.os == 'macOS'
        run: ./dist/SangerSeqAnalyzer.app/Contents/MacOS/SangerSeqAnalyzer --self-test st
      - name: Self-test the desktop app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\SangerSeqAnalyzer\SangerSeqAnalyzer.exe -ArgumentList '--self-test','st' -Wait -PassThru
          if ($p.ExitCode) { Get-Content st\self_test.json; exit 1 }
      - name: Check the self-test report
        shell: bash
        run: python -c "import json; r = json.load(open('st/self_test.json')); print(r); assert r['ok']"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          cp -R dist/SangerSeqAnalyzer.app release/
          cp dist/sanger-seq release/
          cp -R examples release/examples
          cp README.md release/
          ditto -c -k --sequesterRsrc --keepParent release SangerSeqAnalyzer-macos.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir release
          cp -R dist/SangerSeqAnalyzer release/SangerSeqAnalyzer
          cp dist/sanger-seq.exe release/
          cp -R examples release/examples
          cp README.md release/
          cd release && 7z a ../SangerSeqAnalyzer-windows.zip . > /dev/null
      - name: Size gate
        shell: bash
        run: |
          python - <<'EOF'
          import os, sys
          size = os.path.getsize("SangerSeqAnalyzer-${{ matrix.name }}.zip") / 1e6
          print(f"package size {size:.1f} MB (limit ${{ matrix.size_limit_mb }} MB)")
          sys.exit(size > ${{ matrix.size_limit_mb }})
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: SangerSeqAnalyzer-${{ matrix.name }}
          path: SangerSeqAnalyzer-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: SangerSeqAnalyzer-*.zip
