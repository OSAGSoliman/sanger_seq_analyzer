name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[gui,server,dev]"
      - run: python -m pytest -v --durations=15
      - run: sanger-seq qc examples --reference measles-n450 -o sanger_results

  cli-no-qt:
    # the command line, the Fetch data logic and the server must work where Qt is not installed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install without PySide6
        run: python -m pip install -c packaging/constraints.txt -e ".[server,dev]"
      - run: python -c "import sanger_seq_analyzer.cli, sanger_seq_analyzer.fetch.session, sys; assert 'PySide6' not in sys.modules"
      - run: python -m pytest -q --ignore=tests/gui
      - run: sanger-seq qc examples --reference measles-n450 -o sanger_results

  build:
    needs: [test, cli-no-qt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            size_limit_mb: 150
          - os: macos-latest
            name: macos
            size_limit_mb: 250
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c packaging/constraints.txt ".[gui,build]"
      - name: Build desktop app and command-line tool
        run: python packaging/build.py
      - name: Smoke test the command-line build
        shell: bash
        run: |
          ./dist/sanger-seq qc examples -r measles-n450 -o smoke
          test "$(grep -c '^>' smoke/consensus.fasta)" = "3"
      - name: Launch the desktop app on the native platform (macOS)
        # The self-test below runs offscreen; this opens the real Cocoa window, where v0.3.0
        # crashed at launch (theme restyled from a colour-scheme signal during QApplication setup).
        if: runner.os == 'macOS'
        run: ./dist/SangerSeqAnalyzer.app/Contents/MacOS/SangerSeqAnalyzer --quit-after 8
      - name: Self-test the desktop app (macOS)
        if: runner.os == 'macOS'
        run: ./dist/SangerSeqAnalyzer.app/Contents/MacOS/SangerSeqAnalyzer --self-test st
      - name: Launch the desktop app on the native platform (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\SangerSeqAnalyzer\SangerSeqAnalyzer.exe -ArgumentList '--quit-after','8' -Wait -PassThru
          if ($p.ExitCode) { Write-Error "app exited with $($p.ExitCode)"; exit 1 }
      - name: Self-test the desktop app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\SangerSeqAnalyzer\SangerSeqAnalyzer.exe -ArgumentList '--self-test','st' -Wait -PassThru
          if ($p.ExitCode) { Get-Content st\self_test.json; exit 1 }
      - name: Check the self-test report
        shell: bash
        run: python -c "import json; r = json.load(open('st/self_test.json')); print(r); assert r['ok']"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release
          cp -R dist/SangerSeqAnalyzer.app release/
          cp dist/sanger-seq release/
          cp -R examples release/examples
          cp README.md release/
          ditto -c -k --sequesterRsrc --keepParent release SangerSeqAnalyzer-macos.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir release
          cp -R dist/SangerSeqAnalyzer release/SangerSeqAnalyzer
          cp dist/sanger-seq.exe release/
          cp -R examples release/examples
          cp README.md release/
          cd release && 7z a ../SangerSeqAnalyzer-windows.zip . > /dev/null
      - name: Size gate
        shell: bash
        run: |
          python - <<'EOF'
          import os, sys
          size = os.path.getsize("SangerSeqAnalyzer-${{ matrix.name }}.zip") / 1e6
          print(f"package size {size:.1f} MB (limit ${{ matrix.size_limit_mb }} MB)")
          sys.exit(size > ${{ matrix.size_limit_mb }})
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: SangerSeqAnalyzer-${{ matrix.name }}
          path: SangerSeqAnalyzer-${{ matrix.name }}.zip

  server-windows:
    # the lab server as a Windows executable and service (WinSW), smoke-tested on the runner
    needs: [test, cli-no-qt]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SSA_PW: "ci smoke password 123"
      WINSW_SHA256: "b5066b7bbdfba1293e5d15cda3caaea88fbeab35bd5b38c41c913d492aadfc4f"  # WinSW.NET461.exe v2.12.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c packaging/constraints.txt ".[server,build]"
      - name: Build the server executable
        run: python packaging/build.py server
      - name: Get WinSW (pinned by checksum)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe -OutFile WinSW.exe
          $h = (Get-FileHash WinSW.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:WINSW_SHA256) { throw "WinSW checksum mismatch: $h" }
      - name: Smoke test the executable
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\ssa-data"
          $env:SSA_PW | dist\SangerSeqServer\SangerSeqServer.exe server --data $data create-admin --username chief --password-stdin
          if ($LASTEXITCODE) { exit 1 }
          (Get-Content "$data\config.toml") -replace '^port = \d+', 'port = 18080' | Set-Content "$data\config.toml"
          $p = Start-Process dist\SangerSeqServer\SangerSeqServer.exe -ArgumentList 'serve','--data',$data -PassThru
          python packaging/server/smoke.py --base http://127.0.0.1:18080 --user chief --examples examples --wait 90
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          if ($code) { Get-Content "$data\logs\server.log" -Tail 60; exit $code }
      - name: Package
        shell: bash
        run: |
          mkdir server-release
          cp -R dist/SangerSeqServer server-release/SangerSeqServer
          cp WinSW.exe server-release/SangerSeqServerService.exe
          cp packaging/server/windows/*.ps1 packaging/server/windows/SangerSeqServerService.xml \
             packaging/server/windows/WinSW-LICENSE.txt packaging/server/smoke.py DEPLOY.md server-release/
          cd server-release && 7z a ../SangerSeqServer-windows.zip . > /dev/null
      - name: Install, check and remove the Windows service
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File server-release\install.ps1 -Port 18081 -NoFirewall
          if ($LASTEXITCODE) { exit 1 }
          $ok = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest http://127.0.0.1:18081/healthz -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          Get-Service SangerSeqServer | Format-List Name, Status, StartType
          if (-not $ok) { Get-ChildItem "$env:ProgramData\SangerSeqServer\logs" | ForEach-Object { Get-Content $_.FullName -Tail 40 }; exit 1 }
          powershell -ExecutionPolicy Bypass -File "$env:ProgramFiles\SangerSeqServer\uninstall.ps1" -RemoveData
          if (Get-Service SangerSeqServer -ErrorAction SilentlyContinue) { throw "service still installed" }
      - uses: actions/upload-artifact@v4
        with:
          name: SangerSeqServer-windows
          path: SangerSeqServer-windows.zip

  server-docker:
    # the lab server as a Linux container, smoke-tested; on release tags also saved and pushed to GHCR
    needs: [test, cli-no-qt]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SSA_PW: "ci smoke password 123"
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f packaging/server/Dockerfile -t sanger-seq-server:ci .
      - name: Smoke test the container
        run: |
          mkdir data && sudo chown 10001:10001 data
          docker run -d --name ssa -p 18082:8443 -v "$PWD/data:/data" --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true sanger-seq-server:ci
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' ssa)" != "true" ]; then docker logs ssa; ls -la data; exit 1; fi
          echo "$SSA_PW" | docker exec -i ssa sanger-seq server create-admin --username chief --password-stdin
          python3 packaging/server/smoke.py --base http://127.0.0.1:18082 --user chief --examples examples --wait 90 \
            || { docker logs ssa | tail -60; exit 1; }
          docker exec ssa sanger-seq server health
          docker exec ssa sanger-seq server backup
          docker rm -f ssa
      - name: Save and publish the image (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/sanger-seq-server"
          docker tag sanger-seq-server:ci "sanger-seq-server:$version"
          docker save "sanger-seq-server:$version" | gzip > sanger-seq-server-image.tar.gz
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag sanger-seq-server:ci "$image:$version" && docker tag sanger-seq-server:ci "$image:latest"
          docker push "$image:$version" && docker push "$image:latest"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: sanger-seq-server-image
          path: sanger-seq-server-image.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, server-windows, server-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SangerSeqAnalyzer-*.zip
            SangerSeqServer-windows.zip
            sanger-seq-server-image.tar.gz
